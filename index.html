<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Astronomi | Dimensi Luar Angkasa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* prevent accidental text selection on mobile */
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', 'Poppins', 'Rajdhani', monospace;
            background: #000;
            color: #fff;
        }

        /* Canvas utama untuk bintang, nebula, galaksi, partikel meteor */
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        /* Overlay hologram & UI */
        .interface {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
            pointer-events: auto;
        }

        /* Panel hologram transparan dengan neon glow */
        .hologram-panel {
            background: rgba(10, 20, 40, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.2);
            padding: 2rem 2.5rem;
            width: 90%;
            max-width: 580px;
            text-align: center;
            transition: all 0.4s ease;
            animation: floatGlow 3s infinite alternate;
        }

        @keyframes floatGlow {
            0% {
                box-shadow: 0 0 20px rgba(80, 150, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2);
                transform: translateY(0px);
            }
            100% {
                box-shadow: 0 0 50px rgba(100, 100, 255, 0.7), inset 0 0 30px rgba(0, 255, 200, 0.5);
                transform: translateY(-6px);
            }
        }

        /* area teks ketik */
        .typing-area {
            min-height: 110px;
            margin-bottom: 2rem;
        }

        .typing-text {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-shadow: 0 0 8px cyan, 0 0 3px blue;
            color: #b5ffff;
            font-family: 'Share Tech Mono', 'Orbitron', monospace;
            word-break: break-word;
        }

        /* Tombol utama futuristik */
        .cosmic-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #0cf;
            color: #0cf;
            font-family: 'Orbitron', monospace;
            font-size: 1.7rem;
            font-weight: bold;
            padding: 1rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s ease;
            letter-spacing: 3px;
            box-shadow: 0 0 15px #0cf, inset 0 0 5px #0cf;
            width: 100%;
            max-width: 380px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .cosmic-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .cosmic-btn:hover::before, .cosmic-btn:active::before {
            left: 100%;
        }

        .cosmic-btn:hover {
            background: rgba(0, 200, 255, 0.2);
            box-shadow: 0 0 35px #0cf, inset 0 0 12px cyan;
            transform: scale(1.02);
            border-color: #f0f;
            color: #fff;
            text-shadow: 0 0 5px magenta;
        }

        /* Loading overlay (warp + portal) */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #010318, #000000);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: opacity 0.8s;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .warp-stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .energy-ring {
            width: 120px;
            height: 120px;
            border: 4px solid transparent;
            border-top: 4px solid #0cf;
            border-right: 4px solid #f0f;
            border-radius: 50%;
            animation: spinRing 1s linear infinite;
            box-shadow: 0 0 20px cyan;
            margin-bottom: 20px;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.8rem;
            letter-spacing: 6px;
            background: linear-gradient(45deg, cyan, magenta);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulseText 1.2s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; text-shadow: 0 0 0px;}
            100% { opacity: 1; text-shadow: 0 0 15px cyan;}
        }

        /* efek cahaya mengikuti mouse/jari */
        .light-follow {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(80,150,255,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            will-change: transform;
            filter: blur(8px);
        }

        /* Responsive tweaks */
        @media (max-width: 650px) {
            .cosmic-btn {
                font-size: 1.2rem;
                padding: 0.8rem 1.2rem;
            }
            .typing-text {
                font-size: 1rem;
            }
            .hologram-panel {
                padding: 1.3rem 1rem;
                width: 92%;
            }
        }

        /* teks efek scanning */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 15px cyan;
            z-index: 20;
            animation: scanMove 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 95%; opacity: 0.3; }
            100% { top: 0%; opacity: 0.8; }
        }
    </style>
</head>
<body>

    <canvas id="universeCanvas"></canvas>
    <div class="light-follow" id="lightCursor"></div>
    <div class="scan-line"></div>

    <div class="interface" id="mainInterface">
        <div class="hologram-panel">
            <div class="typing-area" id="typingContainer">
                <div class="typing-text" id="dynamicText"></div>
            </div>
            <button class="cosmic-btn" id="enterBtn">⟁ MASUK KE DIMENSI ASTRONOMI ⟁</button>
        </div>
    </div>

    <!-- Loading / warp portal overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="warp-stars" id="warpCanvasContainer"></div>
        <div class="energy-ring"></div>
        <div class="loading-text" id="loadingMsg">Membuka portal galaksi...</div>
    </div>

    <script>
        (function(){
            // -------------------------------
            // 1. Audio Context (Futuristic Space Ambience)
            // -------------------------------
            let audioContext = null;
            let isAudioStarted = false;
            let gainNode = null;
            let oscillatorLow = null;
            let oscillatorHigh = null;
            
            function initAudio() {
                if (audioContext && isAudioStarted) return;
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    gainNode.gain.value = 0.25;
                    gainNode.connect(audioContext.destination);
                    
                    // ambient deep space drone
                    oscillatorLow = audioContext.createOscillator();
                    oscillatorLow.type = 'sine';
                    oscillatorLow.frequency.value = 48; // deep rumble
                    
                    const lfo = audioContext.createOscillator();
                    lfo.frequency.value = 0.15;
                    const lfoGain = audioContext.createGain();
                    lfoGain.gain.value = 4;
                    lfo.connect(lfoGain);
                    lfoGain.connect(oscillatorLow.frequency);
                    
                    oscillatorLow.connect(gainNode);
                    
                    oscillatorHigh = audioContext.createOscillator();
                    oscillatorHigh.type = 'sawtooth';
                    oscillatorHigh.frequency.value = 245;
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 700;
                    oscillatorHigh.connect(filter);
                    filter.connect(gainNode);
                    
                    // subtle wind/space hiss (noise)
                    const bufferSize = 4096;
                    const noiseNode = audioContext.createScriptProcessor(bufferSize, 1, 1);
                    noiseNode.onaudioprocess = function(e) {
                        const output = e.outputBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = (Math.random() - 0.5) * 0.08;
                        }
                    };
                    const noiseGain = audioContext.createGain();
                    noiseGain.gain.value = 0.12;
                    noiseNode.connect(noiseGain);
                    noiseGain.connect(gainNode);
                    
                    oscillatorLow.start();
                    oscillatorHigh.start();
                    lfo.start();
                    noiseNode.connect(gainNode);
                    
                    audioContext.resume();
                    isAudioStarted = true;
                } catch(e) { console.log("Audio autoplay mungkin diblok, perlu interaksi user"); }
            }
            
            // Audio dimulai saat user pertama kali sentuh/klik tombol atau body
            function enableAudioOnFirstInteraction() {
                if (audioContext && isAudioStarted) return;
                initAudio();
                document.removeEventListener('click', enableAudioOnFirstInteraction);
                document.removeEventListener('touchstart', enableAudioOnFirstInteraction);
            }
            document.addEventListener('click', enableAudioOnFirstInteraction);
            document.addEventListener('touchstart', enableAudioOnFirstInteraction);
            
            // -------------------------------
            // 2. Canvas Universe (bintang, nebula, planet, meteor, galaksi berputar)
            // -------------------------------
            const canvas = document.getElementById('universeCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            let meteors = [];
            let nebulaParticles = [];
            let rotatingGalaxy = { angle: 0, starsPos: [] };
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initStars(width, height);
                initMeteors(20);
                initNebula();
                initGalaxySpiral();
            }
            
            function initStars(w, h) {
                stars = [];
                for(let i = 0; i < 1800; i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        radius: Math.random() * 2 + 0.5,
                        alpha: Math.random() * 0.7 + 0.3,
                        twinkle: Math.random() * 0.05,
                        speed: 0.2 + Math.random() * 0.5
                    });
                }
            }
            
            function initMeteors(count) {
                meteors = [];
                for(let i = 0; i < count; i++) {
                    meteors.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2 + 1,
                        speedX: (Math.random() - 0.5) * 1.8 + 0.5,
                        speedY: Math.random() * 1.2 + 0.6,
                        alpha: 0.9
                    });
                }
            }
            
            function initNebula() {
                nebulaParticles = [];
                for(let i=0;i<150;i++) {
                    nebulaParticles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 70 + 30,
                        hue: 260 + Math.random() * 60, // 260-320 ungu biru
                        alpha: Math.random() * 0.12,
                        driftX: (Math.random() - 0.5) * 0.15,
                        driftY: (Math.random() - 0.5) * 0.1
                    });
                }
            }
            
            function initGalaxySpiral() {
                rotatingGalaxy.starsPos = [];
                for (let i=0;i<600;i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.pow(Math.random(), 1.5) * 200;
                    const xOff = Math.cos(angle) * radius;
                    const yOff = Math.sin(angle) * radius * 0.5;
                    rotatingGalaxy.starsPos.push({ xOff, yOff, radius, angle: angle, size: Math.random() * 2 + 0.6 });
                }
            }
            
            function drawBackgroundNebula() {
                for(let p of nebulaParticles) {
                    const grad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, p.radius);
                    grad.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha*0.7})`);
                    grad.addColorStop(1, `hsla(${p.hue-20}, 70%, 30%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    ctx.fill();
                    p.x += p.driftX;
                    p.y += p.driftY;
                    if(p.x < -200) p.x = width+200;
                    if(p.x > width+200) p.x = -200;
                    if(p.y < -200) p.y = height+200;
                    if(p.y > height+200) p.y = -200;
                }
            }
            
            function drawStars() {
                for(let s of stars) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 240, 200, ${s.alpha + Math.sin(Date.now() * s.twinkle) * 0.15})`;
                    ctx.fill();
                    // gerakan bintang lembut paralaks
                    s.x -= s.speed * 0.08;
                    if(s.x < 0) s.x = width;
                    if(s.x > width) s.x = 0;
                }
            }
            
            function drawMeteors() {
                for(let m of meteors) {
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, m.size, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 180, 80, ${m.alpha})`;
                    ctx.fill();
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = 'orange';
                    m.x += m.speedX;
                    m.y += m.speedY;
                    if(m.x > width+50 || m.y > height+50 || m.x < -50 || m.y < -50) {
                        m.x = Math.random() * width;
                        m.y = -10;
                        m.speedX = (Math.random() - 0.5)*1.5 + 0.8;
                        m.speedY = Math.random() * 1.8 + 1.2;
                    }
                    ctx.shadowBlur = 0;
                }
            }
            
            function drawRotatingGalaxy() {
                const centerX = width * 0.85;
                const centerY = height * 0.2;
                rotatingGalaxy.angle += 0.0025;
                for(let s of rotatingGalaxy.starsPos) {
                    const rotAngle = s.angle + rotatingGalaxy.angle;
                    const x = centerX + Math.cos(rotAngle) * s.radius;
                    const y = centerY + Math.sin(rotAngle) * s.radius * 0.4;
                    ctx.beginPath();
                    ctx.arc(x, y, s.size * 0.9, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(150, 200, 255, 0.7)`;
                    ctx.fill();
                }
                // tambahan glow galactic core
                ctx.beginPath();
                ctx.arc(centerX, centerY, 35, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(210, 130, 255, 0.35)';
                ctx.fill();
                ctx.shadowBlur = 28;
                ctx.shadowColor = '#c8f';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            function drawPlanets() {
                // planet bercahaya besar di pojok kiri bawah
                const planetX = width * 0.12;
                const planetY = height * 0.85;
                const rad = 55;
                const grad = ctx.createLinearGradient(planetX-15, planetY-15, planetX+20, planetY+20);
                grad.addColorStop(0, '#9f7eff');
                grad.addColorStop(1, '#3a2c6e');
                ctx.beginPath();
                ctx.arc(planetX, planetY, rad, 0, Math.PI*2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#a14eff';
                ctx.beginPath();
                ctx.arc(planetX, planetY, rad-8, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(180, 130, 255, 0.3)';
                ctx.fill();
                // ring planet
                ctx.beginPath();
                ctx.ellipse(planetX, planetY-4, rad+12, rad*0.3, 0, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0, 255, 210, 0.35)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            function animateUniverse() {
                if(!ctx) return;
                ctx.clearRect(0, 0, width, height);
                drawBackgroundNebula();
                drawStars();
                drawMeteors();
                drawRotatingGalaxy();
                drawPlanets();
                requestAnimationFrame(animateUniverse);
            }
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                initMeteors(20);
                initNebula();
                initGalaxySpiral();
            });
            resizeCanvas();
            animateUniverse();
            
            // -------------------------------
            // 3. Efek Ketik (typing effect)
            // -------------------------------
            const lines = [
                "Signal ditemukan...",
                "Mendeteksi kehidupan online...",
                "Menghubungkan ke markas astronomi..."
            ];
            let lineIndex = 0;
            let charIndex = 0;
            const typingDiv = document.getElementById('dynamicText');
            let isTyping = true;
            
            function typeNextLine() {
                if(lineIndex >= lines.length) {
                    isTyping = false;
                    return;
                }
                const currentLine = lines[lineIndex];
                if(charIndex <= currentLine.length) {
                    typingDiv.innerHTML = currentLine.substring(0, charIndex) + (charIndex < currentLine.length ? "▊" : "");
                    charIndex++;
                    setTimeout(typeNextLine, 70);
                } else {
                    // line complete, wait then next line
                    charIndex = 0;
                    lineIndex++;
                    setTimeout(() => {
                        if(lineIndex < lines.length) {
                            typingDiv.innerHTML = "";
                            typeNextLine();
                        } else {
                            typingDiv.innerHTML = lines[2] + " ✓";
                            isTyping = false;
                        }
                    }, 400);
                }
            }
            typeNextLine();
            
            // -------------------------------
            // 4. Tombol & Portal + Warp Effect
            // -------------------------------
            const enterBtn = document.getElementById('enterBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingMsgSpan = document.getElementById('loadingMsg');
            let warpAnimFrame = null;
            
            function startWarpEffect() {
                loadingOverlay.classList.add('active');
                const warpContainer = document.getElementById('warpCanvasContainer');
                warpContainer.innerHTML = '';
                const warpCanvas = document.createElement('canvas');
                warpCanvas.width = width;
                warpCanvas.height = height;
                warpCanvas.style.position = 'absolute';
                warpCanvas.style.top = '0';
                warpCanvas.style.left = '0';
                warpCanvas.style.width = '100%';
                warpCanvas.style.height = '100%';
                warpContainer.appendChild(warpCanvas);
                const warpCtx = warpCanvas.getContext('2d');
                let warpStars = [];
                for(let i=0;i<300;i++) {
                    warpStars.push({
                        x: Math.random() * warpCanvas.width,
                        y: Math.random() * warpCanvas.height,
                        radius: Math.random() * 3 + 1,
                        speed: 8 + Math.random() * 20
                    });
                }
                let startTime = performance.now();
                let warpActive = true;
                function drawWarp(now) {
                    if(!warpActive) return;
                    warpCtx.clearRect(0, 0, warpCanvas.width, warpCanvas.height);
                    warpCtx.fillStyle = 'rgba(0,0,0,0.7)';
                    warpCtx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);
                    for(let s of warpStars) {
                        warpCtx.beginPath();
                        warpCtx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
                        warpCtx.fillStyle = `hsl(${Math.random() * 60 + 200}, 100%, 70%)`;
                        warpCtx.fill();
                        // streaking effect
                        warpCtx.beginPath();
                        warpCtx.moveTo(s.x, s.y);
                        warpCtx.lineTo(s.x - s.speed*2.5, s.y + (Math.random()-0.5)*5);
                        warpCtx.lineWidth = s.radius;
                        warpCtx.strokeStyle = 'cyan';
                        warpCtx.stroke();
                        s.x -= s.speed;
                        if(s.x < -20) {
                            s.x = warpCanvas.width + 15;
                            s.y = Math.random() * warpCanvas.height;
                        }
                    }
                    if(performance.now() - startTime < 2500) {
                        warpAnimFrame = requestAnimationFrame(drawWarp);
                    } else {
                        warpActive = false;
                        cancelAnimationFrame(warpAnimFrame);
                        // redirect
                        window.location.href = "https://chat.whatsapp.com/FsJjdmjvYJqIN9IxdjeO15";
                    }
                }
                drawWarp(performance.now());
                
                // loading text animasi ubah
                let dotCount = 0;
                const intervalLoad = setInterval(() => {
                    if(!loadingOverlay.classList.contains('active')) {
                        clearInterval(intervalLoad);
                        return;
                    }
                    dotCount = (dotCount + 1) % 4;
                    loadingMsgSpan.innerText = "Membuka portal galaksi" + ".".repeat(dotCount);
                }, 400);
                setTimeout(() => {
                    clearInterval(intervalLoad);
                }, 2400);
            }
            
            function portalTrigger() {
                // Efek shake halus pada panel
                const panel = document.querySelector('.hologram-panel');
                panel.style.animation = 'none';
                panel.offsetHeight;
                panel.style.animation = 'floatGlow 0.2s ease 3';
                setTimeout(() => {
                    panel.style.animation = 'floatGlow 3s infinite alternate';
                }, 300);
                
                // Shake seluruh layar
                const body = document.body;
                body.style.transform = 'translate(2px, 1px)';
                setTimeout(() => body.style.transform = 'translate(-2px, -1px)', 30);
                setTimeout(() => body.style.transform = 'translate(1px, -1px)', 60);
                setTimeout(() => body.style.transform = 'translate(0,0)', 100);
                
                startWarpEffect();
            }
            
            enterBtn.addEventListener('click', portalTrigger);
            enterBtn.addEventListener('touchstart', portalTrigger);
            
            // -------------------------------
            // 5. Light follow mouse / jari
            // -------------------------------
            const lightCursor = document.getElementById('lightCursor');
            function updateLight(e) {
                let clientX, clientY;
                if(e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                lightCursor.style.left = clientX + 'px';
                lightCursor.style.top = clientY + 'px';
            }
            window.addEventListener('mousemove', updateLight);
            window.addEventListener('touchmove', updateLight);
            window.addEventListener('touchstart', updateLight);
            
            // Pastikan audio context di-resume saat tombol disentuh (untuk auto-play)
            enterBtn.addEventListener('click', () => { if(audioContext) audioContext.resume(); });
            enterBtn.addEventListener('touchstart', () => { if(audioContext) audioContext.resume(); });
            
            // Fallback, inisialisasi canvas warp responsive
            setInterval(() => {
                if(loadingOverlay.classList.contains('active')) return;
                // dynamic nebula drifts small update
                for(let n of nebulaParticles) {
                    n.x += n.driftX * 0.2;
                    n.y += n.driftY * 0.2;
                    if(n.x > width+300) n.x = -300;
                    if(n.x < -300) n.x = width+300;
                    if(n.y > height+300) n.y = -300;
                    if(n.y < -300) n.y = height+300;
                }
            }, 600);
            
            // preload nothing heavy
            console.log("Astronomi portal aktif — nasa meets cyberpunk");
        })();
    </script>
</body>
</html>
